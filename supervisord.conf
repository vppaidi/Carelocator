[supervisord]
nodaemon=true
logfile=/home/LogFiles/supervisord.log

; -------- Web (Gunicorn) --------
[program:web]
command=python -m gunicorn -c /home/site/wwwroot/gunicorn.conf.py DSS:app
autostart=true
autorestart=true
stdout_logfile=/home/LogFiles/gunicorn_out.log
stderr_logfile=/home/LogFiles/gunicorn_err.log
stopasgroup=true
killasgroup=true

; -------- RQ workers (2 of them) --------
; Adjust queue list if you use more than 'default'
; e.g., command=python -m rq worker -u %(ENV_REDIS_URL)s --path . pfac default

[program:worker1]
command=python -m rq worker -u %(ENV_REDIS_URL)s --path . default
autostart=true
autorestart=true
stdout_logfile=/home/LogFiles/rq1_out.log
stderr_logfile=/home/LogFiles/rq1_err.log
stopasgroup=true
killasgroup=true

[program:worker2]
command=python -m rq worker -u %(ENV_REDIS_URL)s --path . default
autostart=true
autorestart=true
stdout_logfile=/home/LogFiles/rq2_out.log
stderr_logfile=/home/LogFiles/rq2_err.log
stopasgroup=true
killasgroup=true
