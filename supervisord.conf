[supervisord]
nodaemon=true
logfile=/home/LogFiles/supervisord.log

[program:web]
command=/usr/local/bin/gunicorn -c /home/site/wwwroot/gunicorn.conf.py DSS:app
directory=/home/site/wwwroot
autostart=true
autorestart=true
stdout_logfile=/home/LogFiles/gunicorn_out.log
stderr_logfile=/home/LogFiles/gunicorn_err.log
stopasgroup=true
killasgroup=true

; --- two workers; duplicate block and change 'program' name for more ---
[program:worker1]
command=/usr/local/bin/python -m rq worker -u %(ENV_REDIS_URL)s --path . default
directory=/home/site/wwwroot
autostart=true
autorestart=true
stdout_logfile=/home/LogFiles/rq1_out.log
stderr_logfile=/home/LogFiles/rq1_err.log
stopasgroup=true
killasgroup=true

[program:worker2]
command=/usr/local/bin/python -m rq worker -u %(ENV_REDIS_URL)s --path . default
directory=/home/site/wwwroot
autostart=true
autorestart=true
stdout_logfile=/home/LogFiles/rq2_out.log
stderr_logfile=/home/LogFiles/rq2_err.log
stopasgroup=true
killasgroup=true
