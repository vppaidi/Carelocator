name: Build and deploy Python app to Azure Web App - carelocator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Optional: sanity install to fail fast if requirements.txt is broken
      - name: Validate requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.git/
            !**/__pycache__/**

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: app

      # Make the bundled HiGHS solver executable (if present)
      - name: Make highs binary executable
        run: chmod +x app/bin/highs || true

      # EITHER publish-profile (as you have) OR OIDC login; keep one path.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carelocator'         # must match your Web App name
          slot-name: 'Production'
          package: app                    # deploy exactly what we downloaded
          publish-profile: ${{ secrets.__publishingprofilesecretname__ }}
          enable-oryx-build: true         # install requirements on App Service
